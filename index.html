<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetGoods Member</title>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>สมัครสมาชิก PetGoods</h2>

        <div id="profile" class="profile">
            กำลังโหลดข้อมูล...
        </div>

        <input type="text" id="fullname" placeholder="ชื่อ - นามสกุล">

        <input type="tel" id="phone" placeholder="เบอร์โทรศัพท์">

        <input type="date" id="birthday">

        <input type="text" id="province" placeholder="จังหวัด">

        <select id="pettype">
            <option value="">เลือกประเภทสัตว์เลี้ยง</option>
            <option>สุนัข</option>
            <option>แมว</option>
            <option>นก</option>
            <option>ปลา</option>
            <option>สัตว์เลี้ยงอื่นๆ</option>
        </select>

        <button onclick="submitForm()">
            สมัครสมาชิก
        </button>

        <p id="result"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
